[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darwizzy-wirtzzy"
version = "0.1.0"
description = "An offline foundation for historical football player valuation experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
darwizzy-wirtzzy = "darwizzy_wirtzzy.cli:main"

[tool.setuptools.packages.find]
include = ["darwizzy_wirtzzy*"]
